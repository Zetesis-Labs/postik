name: postik

services:
  dev:
    build: .
    command: sleep infinity
    working_dir: /workspace
    volumes:
      - ..:/workspace:cached
      - go_mod_cache:/go/pkg/mod
      - go_build_cache:/root/.cache/go-build
      - pnpm_store:/root/.local/share/pnpm
      - playwright_cache:/root/.cache/ms-playwright
      - web_node_modules:/workspace/web/node_modules
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgres://postik:postik@postgres:5432/postik?sslmode=disable
      TEST_DATABASE_URL: postgres://postik:postik@postgres:5432/postgres?sslmode=disable
      ATLAS_DEV_DATABASE_URL: postgres://postik:postik@postgres-schema:5432/postik_schema?sslmode=disable&search_path=public
      POSTIK_PUBLIC_URL: http://localhost:8484
      POSTIK_LISTEN_ADDR: :8080
      POSTIK_SUPERADMIN_USERNAME: ${POSTIK_SUPERADMIN_USERNAME:-admin}
      POSTIK_SUPERADMIN_PASSWORD: ${POSTIK_SUPERADMIN_PASSWORD:-admin}
      POSTIK_OIDC_ISSUER: ${POSTIK_OIDC_ISSUER:-http://localhost:5556}
      POSTIK_OIDC_CLIENT_ID: ${POSTIK_OIDC_CLIENT_ID:-postik}
      POSTIK_OIDC_CLIENT_SECRET: ${POSTIK_OIDC_CLIENT_SECRET:-postik-secret}
      POSTIK_OIDC_DISPLAY_NAME: ${POSTIK_OIDC_DISPLAY_NAME:-Fake}
      POSTIK_TELEGRAM_BOT_TOKEN: ${POSTIK_TELEGRAM_BOT_TOKEN:-fake-token}
      POSTIK_TELEGRAM_API_URL: ${POSTIK_TELEGRAM_API_URL:-http://localhost:5556/telegram}
      POSTIK_STORAGE_DIR: /workspace/.data/uploads
    ports:
      - "8484:8080"
      - "5184:5173"
      - "5556:5556"
    depends_on:
      postgres:
        condition: service_healthy
      postgres-schema:
        condition: service_healthy

  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: postik
      POSTGRES_PASSWORD: postik
      POSTGRES_DB: postik
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postik"]
      interval: 2s
      timeout: 3s
      retries: 30

  postgres-schema:
    image: postgres:18
    environment:
      POSTGRES_USER: postik
      POSTGRES_PASSWORD: postik
      POSTGRES_DB: postik_schema
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postik"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  go_mod_cache:
  go_build_cache:
  pnpm_store:
  playwright_cache:
  web_node_modules:
  pgdata:
