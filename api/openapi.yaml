openapi: 3.0.3
info:
  title: postik
  version: 0.1.0
servers:
  - url: /api/v1
paths:
  /instance:
    get:
      operationId: getInstance
      responses:
        "200":
          description: Public instance configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Instance"
  /auth/superadmin:
    post:
      operationId: loginSuperadmin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SuperadminLogin"
      responses:
        "200":
          description: Session opened
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Error"
  /auth/logout:
    post:
      operationId: logout
      responses:
        "204":
          description: Session closed
          headers:
            Set-Cookie:
              schema:
                type: string
  /me/active-organization:
    post:
      operationId: setActiveOrganization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActiveOrganization"
      responses:
        "204":
          description: Active organization changed
          headers:
            Set-Cookie:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /me:
    get:
      operationId: getMe
      responses:
        "200":
          description: Current session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Error"
components:
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
    Instance:
      type: object
      required: [superadminTotp, languages]
      properties:
        superadminTotp:
          type: boolean
        languages:
          type: array
          items:
            type: string
        oidc:
          $ref: "#/components/schemas/OidcProvider"
    OidcProvider:
      type: object
      required: [name]
      properties:
        name:
          type: string
    ActiveOrganization:
      type: object
      required: [organizationId]
      properties:
        organizationId:
          type: string
          format: uuid
    SuperadminLogin:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
        code:
          type: string
    Me:
      type: object
      required: [kind]
      properties:
        kind:
          type: string
          enum: [superadmin, member]
        user:
          $ref: "#/components/schemas/MeUser"
        organizations:
          type: array
          items:
            $ref: "#/components/schemas/MeOrganization"
        activeOrganizationId:
          type: string
          format: uuid
    MeUser:
      type: object
      required: [id, name, email]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
    MeOrganization:
      type: object
      required: [id, name, role]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        role:
          type: string
          enum: [USER, ADMIN, OWNER]
