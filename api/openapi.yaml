openapi: 3.0.3
info:
  title: postik
  version: 0.1.0
servers:
  - url: /api/v1
paths:
  /instance:
    get:
      operationId: getInstance
      responses:
        "200":
          description: Public instance configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Instance"
  /auth/superadmin:
    post:
      operationId: loginSuperadmin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SuperadminLogin"
      responses:
        "200":
          description: Session opened
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Error"
  /auth/logout:
    post:
      operationId: logout
      responses:
        "204":
          description: Session closed
          headers:
            Set-Cookie:
              schema:
                type: string
  /me/active-organization:
    post:
      operationId: setActiveOrganization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActiveOrganization"
      responses:
        "204":
          description: Active organization changed
          headers:
            Set-Cookie:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /channels/providers:
    get:
      operationId: listProviders
      responses:
        "200":
          description: Providers with credentials
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Provider"
        "401":
          $ref: "#/components/responses/Error"
  /channels:
    get:
      operationId: listChannels
      responses:
        "200":
          description: Channels of the active organization
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Channel"
        "401":
          $ref: "#/components/responses/Error"
  /channels/{id}:
    delete:
      operationId: deleteChannel
      parameters:
        - $ref: "#/components/parameters/ChannelID"
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /channels/{id}/disabled:
    put:
      operationId: setChannelDisabled
      parameters:
        - $ref: "#/components/parameters/ChannelID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [disabled]
              properties:
                disabled:
                  type: boolean
      responses:
        "204":
          description: Updated
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /channels/{id}/customer:
    put:
      operationId: setChannelCustomer
      parameters:
        - $ref: "#/components/parameters/ChannelID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChannelCustomer"
      responses:
        "204":
          description: Updated
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /channels/{id}/posting-times:
    put:
      operationId: setChannelPostingTimes
      parameters:
        - $ref: "#/components/parameters/ChannelID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [times]
              properties:
                times:
                  type: array
                  items:
                    type: integer
      responses:
        "204":
          description: Updated
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /customers:
    get:
      operationId: listCustomers
      responses:
        "200":
          description: Customers of the active organization
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Customer"
        "401":
          $ref: "#/components/responses/Error"
  /channels/telegram/connections:
    post:
      operationId: openTelegramConnection
      responses:
        "201":
          description: Pending connection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TelegramConnection"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "502":
          $ref: "#/components/responses/Error"
  /channels/telegram/connections/{code}:
    get:
      operationId: getTelegramConnection
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Connection status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TelegramConnectionStatus"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "502":
          $ref: "#/components/responses/Error"
  /media:
    get:
      operationId: listMedia
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
        - name: search
          in: query
          schema:
            type: string
      responses:
        "200":
          description: One page of the library
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaPage"
        "401":
          $ref: "#/components/responses/Error"
    post:
      operationId: uploadMedia
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "201":
          description: Uploaded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Media"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "413":
          $ref: "#/components/responses/Error"
        "415":
          $ref: "#/components/responses/Error"
  /media/{id}:
    put:
      operationId: updateMedia
      parameters:
        - $ref: "#/components/parameters/MediaID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MediaUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Media"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteMedia
      parameters:
        - $ref: "#/components/parameters/MediaID"
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /tags:
    get:
      operationId: listTags
      responses:
        "200":
          description: Tags of the active organization
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Tag"
        "401":
          $ref: "#/components/responses/Error"
    post:
      operationId: createTag
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TagInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tag"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /tags/{id}:
    put:
      operationId: updateTag
      parameters:
        - $ref: "#/components/parameters/TagID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TagInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tag"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteTag
      parameters:
        - $ref: "#/components/parameters/TagID"
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /posts:
    get:
      operationId: listCalendarPosts
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date-time
        - name: customer
          in: query
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Posts of the range
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CalendarPost"
        "401":
          $ref: "#/components/responses/Error"
    post:
      operationId: createPosts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewPosts"
      responses:
        "201":
          description: Group created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedGroup"
        "400":
          $ref: "#/components/responses/InvalidPost"
        "401":
          $ref: "#/components/responses/Error"
  /posts/list:
    get:
      operationId: listPosts
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
        - name: status
          in: query
          schema:
            type: string
            enum: [all, scheduled, draft, published]
      responses:
        "200":
          description: One page of posts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostPage"
        "401":
          $ref: "#/components/responses/Error"
  /posts/next-slot:
    get:
      operationId: nextSlot
      parameters:
        - name: channelId
          in: query
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Next free slot
          content:
            application/json:
              schema:
                type: object
                required: [date]
                properties:
                  date:
                    type: string
                    format: date-time
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /posts/{id}:
    get:
      operationId: getPost
      parameters:
        - $ref: "#/components/parameters/PostID"
      responses:
        "200":
          description: The post
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostDetail"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    put:
      operationId: updatePost
      parameters:
        - $ref: "#/components/parameters/PostID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostEdit"
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostDetail"
        "400":
          $ref: "#/components/responses/InvalidPost"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /posts/{id}/date:
    put:
      operationId: movePost
      parameters:
        - $ref: "#/components/parameters/PostID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostMove"
      responses:
        "204":
          description: Moved
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /posts/{id}/release:
    put:
      operationId: linkPostRelease
      parameters:
        - $ref: "#/components/parameters/PostID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url:
                  type: string
      responses:
        "204":
          description: Linked
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /posts/{id}/group:
    delete:
      operationId: deletePostGroup
      parameters:
        - $ref: "#/components/parameters/PostID"
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /me:
    get:
      operationId: getMe
      responses:
        "200":
          description: Current session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Error"
components:
  parameters:
    TagID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PostID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    MediaID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ChannelID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    InvalidPost:
      description: The post does not pass validation
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/InvalidPost"
    Error:
      description: Error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
    Tag:
      type: object
      required: [id, name, color]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        color:
          type: string
    TagInput:
      type: object
      required: [name, color]
      properties:
        name:
          type: string
        color:
          type: string
    PostMediaRef:
      type: object
      required: [id]
      properties:
        id:
          type: string
          format: uuid
    PostValueInput:
      type: object
      required: [content, delayMinutes, media]
      properties:
        content:
          type: string
        delayMinutes:
          type: integer
          minimum: 0
        media:
          type: array
          items:
            $ref: "#/components/schemas/PostMediaRef"
    PostMedia:
      type: object
      required: [id, url, kind]
      properties:
        id:
          type: string
          format: uuid
        url:
          type: string
        kind:
          type: string
        alt:
          type: string
        thumbnailUrl:
          type: string
        thumbnailSeconds:
          type: integer
    PostValue:
      type: object
      required: [content, delayMinutes, media]
      properties:
        content:
          type: string
        delayMinutes:
          type: integer
        media:
          type: array
          items:
            $ref: "#/components/schemas/PostMedia"
    ChannelPostInput:
      type: object
      required: [channelId, values, settings]
      properties:
        channelId:
          type: string
          format: uuid
        values:
          type: array
          items:
            $ref: "#/components/schemas/PostValueInput"
        settings:
          type: object
          additionalProperties: true
    NewPosts:
      type: object
      required: [type, publishAt, tags, posts]
      properties:
        type:
          type: string
          enum: [schedule, draft, now]
        publishAt:
          type: string
          format: date-time
        tags:
          type: array
          items:
            type: string
            format: uuid
        posts:
          type: array
          items:
            $ref: "#/components/schemas/ChannelPostInput"
    CreatedGroup:
      type: object
      required: [groupId, posts]
      properties:
        groupId:
          type: string
          format: uuid
        posts:
          type: array
          items:
            type: object
            required: [id, channelId]
            properties:
              id:
                type: string
                format: uuid
              channelId:
                type: string
                format: uuid
    Problem:
      type: object
      required: [code]
      properties:
        code:
          type: string
        channelId:
          type: string
          format: uuid
        valueIndex:
          type: integer
    InvalidPost:
      type: object
      required: [code, message, problems]
      properties:
        code:
          type: string
        message:
          type: string
        problems:
          type: array
          items:
            $ref: "#/components/schemas/Problem"
    PostChannel:
      type: object
      required: [id, name, provider]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        provider:
          type: string
        picture:
          type: string
        customerId:
          type: string
          format: uuid
    CalendarPost:
      type: object
      required: [id, groupId, status, publishAt, excerpt, channel, tags]
      properties:
        id:
          type: string
          format: uuid
        groupId:
          type: string
          format: uuid
        status:
          type: string
          enum: [draft, scheduled, published, error]
        publishAt:
          type: string
          format: date-time
        excerpt:
          type: string
        channel:
          $ref: "#/components/schemas/PostChannel"
        tags:
          type: array
          items:
            $ref: "#/components/schemas/Tag"
        releaseUrl:
          type: string
        error:
          type: string
    PostPage:
      type: object
      required: [items, page, pages, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CalendarPost"
        page:
          type: integer
        pages:
          type: integer
        total:
          type: integer
    PostDetail:
      type: object
      required: [id, groupId, status, publishAt, channel, values, settings, tags]
      properties:
        id:
          type: string
          format: uuid
        groupId:
          type: string
          format: uuid
        status:
          type: string
          enum: [draft, scheduled, published, error]
        publishAt:
          type: string
          format: date-time
        channel:
          $ref: "#/components/schemas/PostChannel"
        values:
          type: array
          items:
            $ref: "#/components/schemas/PostValue"
        settings:
          type: object
          additionalProperties: true
        tags:
          type: array
          items:
            $ref: "#/components/schemas/Tag"
        releaseUrl:
          type: string
        error:
          type: string
    PostEdit:
      type: object
      required: [mode, publishAt, values, settings, tags]
      properties:
        mode:
          type: string
          enum: [update, schedule]
        republish:
          type: boolean
        publishAt:
          type: string
          format: date-time
        values:
          type: array
          items:
            $ref: "#/components/schemas/PostValueInput"
        settings:
          type: object
          additionalProperties: true
        tags:
          type: array
          items:
            type: string
            format: uuid
    PostMove:
      type: object
      required: [publishAt, mode]
      properties:
        publishAt:
          type: string
          format: date-time
        mode:
          type: string
          enum: [update, schedule]
        republish:
          type: boolean
    Media:
      type: object
      required: [id, name, url, kind, mime, size, alt, createdAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        url:
          type: string
        kind:
          type: string
          enum: [image, video]
        mime:
          type: string
        size:
          type: integer
          format: int64
        alt:
          type: string
        thumbnailUrl:
          type: string
        thumbnailSeconds:
          type: integer
        createdAt:
          type: string
          format: date-time
    MediaPage:
      type: object
      required: [items, page, pages, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Media"
        page:
          type: integer
        pages:
          type: integer
        total:
          type: integer
    MediaUpdate:
      type: object
      properties:
        alt:
          type: string
        thumbnailMediaId:
          type: string
          format: uuid
          nullable: true
        thumbnailSeconds:
          type: integer
          nullable: true
    Provider:
      type: object
      required: [identifier, name]
      properties:
        identifier:
          type: string
        name:
          type: string
    Customer:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
    Channel:
      type: object
      required: [id, provider, name, username, disabled, refreshNeeded, inBetweenSteps, postingTimes]
      properties:
        id:
          type: string
          format: uuid
        provider:
          type: string
        name:
          type: string
        username:
          type: string
        picture:
          type: string
        disabled:
          type: boolean
        refreshNeeded:
          type: boolean
        inBetweenSteps:
          type: boolean
        customer:
          $ref: "#/components/schemas/Customer"
        postingTimes:
          type: array
          items:
            type: integer
    ChannelCustomer:
      type: object
      description: With name, moves by name (created if missing; blank removes). Otherwise moves to customerId, or removes when it is absent or null.
      properties:
        name:
          type: string
        customerId:
          type: string
          format: uuid
          nullable: true
    TelegramConnection:
      type: object
      required: [code, botUsername]
      properties:
        code:
          type: string
        botUsername:
          type: string
    TelegramConnectionStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [pending, connected, expired]
        channelId:
          type: string
          format: uuid
    Instance:
      type: object
      required: [superadminTotp, languages]
      properties:
        superadminTotp:
          type: boolean
        languages:
          type: array
          items:
            type: string
        oidc:
          $ref: "#/components/schemas/OidcProvider"
    OidcProvider:
      type: object
      required: [name]
      properties:
        name:
          type: string
    ActiveOrganization:
      type: object
      required: [organizationId]
      properties:
        organizationId:
          type: string
          format: uuid
    SuperadminLogin:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
        code:
          type: string
    Me:
      type: object
      required: [kind]
      properties:
        kind:
          type: string
          enum: [superadmin, member]
        user:
          $ref: "#/components/schemas/MeUser"
        organizations:
          type: array
          items:
            $ref: "#/components/schemas/MeOrganization"
        activeOrganizationId:
          type: string
          format: uuid
    MeUser:
      type: object
      required: [id, name, email]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
    MeOrganization:
      type: object
      required: [id, name, role]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        role:
          type: string
          enum: [USER, ADMIN, OWNER]
