name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postik
          POSTGRES_PASSWORD: postik
          POSTGRES_DB: postik
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postik"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://postik:postik@localhost:5432/postgres?sslmode=disable
      ATLAS_DEV_DATABASE_URL: postgres://postik:postik@localhost:5432/atlas_dev?sslmode=disable&search_path=public
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: ariga/setup-atlas@v0
      - name: Create the Atlas dev database
        run: psql "postgres://postik:postik@localhost:5432/postgres" -c "CREATE DATABASE atlas_dev"
      - run: make web-install
      - name: Generated code is up to date
        run: make generate && git diff --exit-code
      - run: make fmt-check vet migration-validate
      - run: make test
      - run: make web-typecheck
      - run: make spec-check
      - name: Screen tests
        run: |
          cd web && pnpm exec playwright install --with-deps chromium
          cd .. && make e2e

  image:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/zetesis-labs/postik
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
      - if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
